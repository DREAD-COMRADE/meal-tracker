<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Meal Tracker"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="description" content="Track your meals, macros, budget & grocery list"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Nitheesh — Meal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--muted:#888;--dim:#555;
  --accent:#c8f135;--accent2:#9dba28;
  --danger:#ff5555;--info:#5b9cf6;--warn:#f7c948;--r:10px;--r2:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{padding:20px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.header-left h1{font-size:22px;letter-spacing:-0.5px}
.header-left p{font-size:13px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.reset-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:var(--r2);transition:all .2s;flex-shrink:0;margin-top:4px;font-family:'DM Mono',monospace}
.reset-btn:hover{border-color:var(--danger);color:var(--danger)}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
.macro-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.macro-card.hl{border-color:#2e3d14;background:#131a08}
.macro-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;margin-bottom:6px}
.macro-card .value{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text)}
.macro-card.hl .value{color:var(--accent)}
.macro-card .sub{font-size:11px;color:var(--dim);margin-top:2px;font-family:'DM Mono',monospace}
.macro-card .bar-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.macro-card .bar{height:100%;border-radius:2px;background:var(--border2);transition:width .4s ease}
.macro-card.hl .bar{background:var(--accent)}
.tabs{display:flex;gap:0;padding:0 20px;border-bottom:1px solid var(--border);margin-bottom:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:none;color:var(--muted);font-size:13px;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{flex:1;padding:12px 20px 90px}
.sec-title{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;margin:16px 0 10px}

/* Meals */
.meal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s;margin-bottom:10px}
.meal-card.done{border-color:#2e3d14;background:#0e1508}
.meal-card.done .meal-name{color:var(--accent)}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;cursor:pointer}
.meal-card.done .chk{background:var(--accent);border-color:var(--accent)}
.chk-svg{display:none;width:12px;height:12px}
.meal-card.done .chk-svg{display:block}
.meal-info{flex:1;min-width:0}
.meal-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.meal-name{font-size:14px;font-weight:600}
.meal-time{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;flex-shrink:0}
.meal-foods{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.macro-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace;background:var(--bg3);padding:2px 8px;border-radius:4px}
.rice-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.rice-row label{font-size:12px;color:var(--muted);flex:1}
.rice-input{width:64px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:13px;font-family:'DM Mono',monospace;padding:5px 8px;text-align:right;transition:border-color .2s}
.rice-input:focus{border-color:var(--accent)}
.rice-unit{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace}

/* What-if */
.whatif-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.whatif-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.wi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wi-item{display:flex;flex-direction:column;gap:4px}
.wi-item label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.wi-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:14px;font-family:'DM Mono',monospace;padding:7px 10px;transition:border-color .2s}
.wi-input:focus{border-color:var(--accent)}
.wi-result{background:#131a08;border:1px solid #2e3d14;border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--accent);font-family:'DM Mono',monospace;line-height:1.8;display:none}
.wi-result.show{display:block}
.wi-btn{width:100%;padding:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-size:13px;font-weight:500;transition:all .2s;margin-top:8px}
.wi-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Stock */
.stock-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stock-label{flex:1;font-size:14px}
.stock-unit{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.stock-input{width:72px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:14px;font-family:'DM Mono',monospace;padding:6px 10px;text-align:right;transition:border-color .2s}
.stock-input:focus{border-color:var(--accent)}
.low-badge{font-size:10px;background:#3d1a1a;color:var(--danger);padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace}

/* Grocery */
.grocery-period{display:flex;gap:8px;margin-bottom:14px}
.period-btn{flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--muted);font-size:13px;font-weight:500;transition:all .2s}
.period-btn.active{border-color:var(--accent);color:var(--accent);background:#131a08}
.grocery-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.gi-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gi-name{flex:1;font-size:14px;font-weight:500}
.gi-qty{font-size:12px;color:var(--accent);font-family:'DM Mono',monospace;background:#131a08;padding:3px 8px;border-radius:4px}
.gi-bottom{display:flex;gap:8px;align-items:center}
.gi-bottom label{font-size:12px;color:var(--muted);flex:1}
.price-input{width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:13px;font-family:'DM Mono',monospace;padding:5px 8px;text-align:right;transition:border-color .2s}
.price-input:focus{border-color:var(--accent)}
.gi-unit{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace}
.expense-summary{background:#131a08;border:1px solid #2e3d14;border-radius:var(--r);padding:16px;margin-top:14px}
.exp-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.exp-row+.exp-row{border-top:1px solid #1e2d08}
.exp-key{font-size:13px;color:var(--muted)}
.exp-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.exp-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:2px solid #2e3d14}
.exp-total-key{font-size:14px;font-weight:600}
.exp-total-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}

/* Budget */
.budget-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.b-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.b-field label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.5px}
.b-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:16px;font-family:'DM Mono',monospace;padding:9px 12px;width:100%;transition:border-color .2s}
.b-input:focus{border-color:var(--accent)}
.prog-wrap{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.prog-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.prog-fill.warn{background:var(--warn)}
.prog-fill.danger{background:var(--danger)}
.b-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.b-row+.b-row{border-top:1px solid var(--border)}
.b-key{font-size:13px;color:var(--muted)}
.b-val{font-size:15px;font-weight:600;font-family:'DM Mono',monospace}
.b-val.green{color:var(--accent)}
.b-val.red{color:var(--danger)}

/* Bottom bar */
.summary-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#111;border-top:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
.sum-item{text-align:center}
.sum-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.sum-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1f2d0a;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-family:'DM Mono',monospace;padding:10px 20px;border-radius:var(--r);transition:transform .3s ease;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>Nitheesh</h1>
      <p id="dateStr"></p>
    </div>
    <button class="reset-btn" onclick="resetDay()">↺ Reset Day</button>
  </div>

  <div class="macros">
    <div class="macro-card hl">
      <div class="label">Calories</div>
      <div class="value" id="calVal">0</div>
      <div class="sub" id="calSub">/ 2400 kcal</div>
      <div class="bar-wrap"><div class="bar" id="calBar" style="width:0%"></div></div>
    </div>
    <div class="macro-card hl">
      <div class="label">Protein</div>
      <div class="value" id="proVal">0g</div>
      <div class="sub" id="proSub">/ 140g remaining</div>
      <div class="bar-wrap"><div class="bar" id="proBar" style="width:0%"></div></div>
    </div>
    <div class="macro-card">
      <div class="label">Carbs</div>
      <div class="value" id="carbVal">0g</div>
      <div class="sub">/ 250g</div>
      <div class="bar-wrap"><div class="bar" id="carbBar" style="width:0%"></div></div>
    </div>
    <div class="macro-card">
      <div class="label">Fat</div>
      <div class="value" id="fatVal">0g</div>
      <div class="sub">/ 75g</div>
      <div class="bar-wrap"><div class="bar" id="fatBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('meals',this)">Meals</button>
    <button class="tab-btn" onclick="setTab('whatif',this)">What If?</button>
    <button class="tab-btn" onclick="setTab('stock',this)">Stock</button>
    <button class="tab-btn" onclick="setTab('grocery',this)">Grocery</button>
    <button class="tab-btn" onclick="setTab('budget',this)">Budget</button>
  </div>

  <div class="content">

    <!-- MEALS -->
    <div id="tab-meals">
      <div id="meal-list"></div>
    </div>

    <!-- WHAT IF -->
    <div id="tab-whatif" style="display:none">
      <div class="sec-title">What if I eat more?</div>
      <div class="whatif-card">
        <div class="whatif-title">Quick Add Calculator</div>
        <div class="wi-grid">
          <div class="wi-item">
            <label>EGGS (whole)</label>
            <input class="wi-input" type="number" id="wi-eggs" placeholder="0" oninput="calcWhatIf()"/>
          </div>
          <div class="wi-item">
            <label>RICE (g, cooked)</label>
            <input class="wi-input" type="number" id="wi-rice" placeholder="0" oninput="calcWhatIf()"/>
          </div>
          <div class="wi-item">
            <label>CHICKEN (g)</label>
            <input class="wi-input" type="number" id="wi-chicken" placeholder="0" oninput="calcWhatIf()"/>
          </div>
          <div class="wi-item">
            <label>SOYA CHUNKS (g dry)</label>
            <input class="wi-input" type="number" id="wi-soya" placeholder="0" oninput="calcWhatIf()"/>
          </div>
          <div class="wi-item">
            <label>CHAPATI (pcs)</label>
            <input class="wi-input" type="number" id="wi-chapati" placeholder="0" oninput="calcWhatIf()"/>
          </div>
          <div class="wi-item">
            <label>MILK (ml)</label>
            <input class="wi-input" type="number" id="wi-milk" placeholder="0" oninput="calcWhatIf()"/>
          </div>
        </div>
        <div class="wi-result" id="wi-result"></div>
        <button class="wi-btn" onclick="clearWhatIf()">Clear</button>
      </div>
    </div>

    <!-- STOCK -->
    <div id="tab-stock" style="display:none">
      <div class="sec-title">Grocery Inventory</div>
      <div id="stock-grid"></div>
    </div>

    <!-- GROCERY LIST -->
    <div id="tab-grocery" style="display:none">
      <div class="sec-title">Grocery List</div>
      <div class="grocery-period">
        <button class="period-btn active" onclick="setPeriod('weekly',this)">Weekly</button>
        <button class="period-btn" onclick="setPeriod('monthly',this)">Monthly</button>
      </div>
      <div id="grocery-list"></div>
      <div class="expense-summary" id="expense-summary">
        <div class="sec-title" style="margin-top:0">Estimated Expense</div>
        <div id="exp-rows"></div>
        <div class="exp-total-row">
          <span class="exp-total-key">Total</span>
          <span class="exp-total-val" id="exp-total">₹0</span>
        </div>
      </div>
    </div>

    <!-- BUDGET -->
    <div id="tab-budget" style="display:none">
      <div class="sec-title">Daily Budget</div>
      <div class="budget-card">
        <div class="b-field">
          <label>DAILY BUDGET (₹)</label>
          <input class="b-input" type="number" id="dailyBudget" placeholder="e.g. 300" oninput="updateBudget()"/>
        </div>
        <div class="b-field">
          <label>AMOUNT SPENT TODAY (₹)</label>
          <input class="b-input" type="number" id="spentBudget" placeholder="e.g. 150" oninput="updateBudget()"/>
        </div>
      </div>
      <div class="budget-card" id="budgetSummary" style="display:none">
        <div class="b-row"><span class="b-key">Daily Budget</span><span class="b-val" id="bTotal">₹0</span></div>
        <div class="b-row"><span class="b-key">Spent</span><span class="b-val" id="bSpent">₹0</span></div>
        <div class="prog-wrap"><div class="prog-fill" id="budgetBar" style="width:0%"></div></div>
        <div style="font-size:11px;color:var(--muted);text-align:right;font-family:'DM Mono',monospace;margin-bottom:6px" id="budgetPct">0% used</div>
        <div class="b-row" style="border-top:2px solid var(--border);padding-top:10px">
          <span class="b-key">Remaining</span>
          <span class="b-val green" id="bLeft">₹0</span>
        </div>
      </div>
    </div>

  </div>

  <div class="summary-bar">
    <div class="sum-item"><div class="sum-val" id="sumMeals">0/6</div><div class="sum-label">Meals</div></div>
    <div class="sum-item"><div class="sum-val" id="sumCal">0</div><div class="sum-label">kcal</div></div>
    <div class="sum-item"><div class="sum-val" id="sumPro">0g</div><div class="sum-label">Protein</div></div>
    <div class="sum-item"><div class="sum-val" id="sumLeft">140g</div><div class="sum-label">Remaining</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Register Service Worker for PWA
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      console.log('✓ Service Worker registered');
    }).catch(err=>console.log('Service Worker failed:',err));
  });
}

// Per 100g rice (cooked): 130 kcal, 2.7g protein, 28g carbs, 0.3g fat
// Per egg: 90 kcal, 7.5g protein, 1g carbs, 6g fat
const RICE_PER_100 = {cal:130, p:2.7, c:28, f:0.3};

const MEALS = [
  {id:1,time:'6:00 AM',name:'Meal 1',foods:'2 eggs + 2 whole wheat chapati',cal:360,p:18,c:40,f:12,hasRice:false},
  {id:2,time:'9:00 AM',name:'Meal 2',foods:'Milk 250ml',cal:160,p:8,c:12,f:8,hasRice:false},
  {id:3,time:'12:30 PM',name:'Meal 3',foods:'50g soya chunks + potato + rice',cal:280,p:20,c:22,f:5,hasRice:true},
  {id:4,time:'3:30 PM',name:'Meal 4',foods:'2 whole eggs',cal:180,p:15,c:2,f:12,hasRice:false},
  {id:5,time:'6:15 PM',name:'Meal 5 — Pre Workout',foods:'2 chapati + potato',cal:250,p:7,c:50,f:3,hasRice:false},
  {id:6,time:'8:45 PM',name:'Meal 6 — Post Workout',foods:'100g chicken + 60g liver + 50g soya + rice',cal:430,p:68,c:10,f:15,hasRice:true}
];

// per-unit macros for what-if
const WI_FOODS = {
  eggs:   {cal:90,  p:7.5, c:1,  f:6,  per:'per egg'},
  rice:   {cal:1.3, p:0.027,c:0.28,f:0.003,per:'per g cooked'},
  chicken:{cal:1.65,p:0.31, c:0,  f:0.035,per:'per g'},
  soya:   {cal:3.3, p:0.52, c:0.21,f:0.06,per:'per g dry'},
  chapati:{cal:120, p:3.5, c:22, f:2.5, per:'per chapati'},
  milk:   {cal:0.64,p:0.032,c:0.048,f:0.032,per:'per ml'}
};

const STOCK_ITEMS = [
  {key:'eggs',label:'Eggs',unit:'pcs',low:4},
  {key:'milk',label:'Milk',unit:'ml',low:500},
  {key:'rice',label:'Rice',unit:'g dry',low:500},
  {key:'soya',label:'Soya Chunks',unit:'g',low:100},
  {key:'chicken',label:'Chicken',unit:'g',low:200},
  {key:'liver',label:'Chicken Liver',unit:'g',low:100},
  {key:'potato',label:'Potato',unit:'pcs',low:2},
  {key:'flour',label:'Chapati Flour',unit:'g',low:300},
  {key:'spinach',label:'Spinach',unit:'g',low:100},
  {key:'onion',label:'Onion',unit:'pcs',low:3},
  {key:'tomato',label:'Tomato',unit:'pcs',low:3},
];

// Weekly quantities needed
const GROCERY_ITEMS = [
  {key:'eggs',   label:'Eggs',           weekQty:28,  unit:'pcs',  priceUnit:'per 12 eggs'},
  {key:'milk',   label:'Milk',           weekQty:1750,unit:'ml',   priceUnit:'per 500ml'},
  {key:'rice',   label:'Rice (dry)',     weekQty:1400,unit:'g',    priceUnit:'per 1kg'},
  {key:'soya',   label:'Soya Chunks',    weekQty:700, unit:'g',    priceUnit:'per 200g pack'},
  {key:'chicken',label:'Chicken',        weekQty:700, unit:'g',    priceUnit:'per kg'},
  {key:'liver',  label:'Chicken Liver',  weekQty:420, unit:'g',    priceUnit:'per 500g'},
  {key:'potato', label:'Potato',         weekQty:14,  unit:'pcs',  priceUnit:'per kg (~10 pcs)'},
  {key:'flour',  label:'Chapati Flour',  weekQty:700, unit:'g',    priceUnit:'per kg'},
  {key:'spinach',label:'Spinach',        weekQty:500, unit:'g',    priceUnit:'per 250g bunch'},
  {key:'onion',  label:'Onion',          weekQty:7,   unit:'pcs',  priceUnit:'per kg (~7 pcs)'},
  {key:'tomato', label:'Tomato',         weekQty:14,  unit:'pcs',  priceUnit:'per kg (~8 pcs)'},
  {key:'oil',    label:'Cooking Oil',    weekQty:500, unit:'ml',   priceUnit:'per litre'},
  {key:'spices', label:'Salt & Spices',  weekQty:1,   unit:'set',  priceUnit:'per week estimate'},
];

let state = {checked:{}, riceQty:{3:150, 6:150}, stock:{}, budget:{daily:'',spent:''}, prices:{}, groceryPeriod:'weekly'};

function load(){
  const today = new Date().toDateString();
  const saved = localStorage.getItem('nm_v2');
  if(saved){
    const d = JSON.parse(saved);
    if(d.date === today) state.checked = d.checked || {};
    state.riceQty = d.riceQty || {3:150,6:150};
    state.stock = d.stock || {};
    state.budget = d.budget || {daily:'',spent:''};
    state.prices = d.prices || {};
    state.groceryPeriod = d.groceryPeriod || 'weekly';
  }
}
function save(){
  localStorage.setItem('nm_v2', JSON.stringify({
    date: new Date().toDateString(),
    checked: state.checked,
    riceQty: state.riceQty,
    stock: state.stock,
    budget: state.budget,
    prices: state.prices,
    groceryPeriod: state.groceryPeriod
  }));
}

function getRiceMacros(mealId){
  const g = parseFloat(state.riceQty[mealId]) || 0;
  return {
    cal: g * RICE_PER_100.cal / 100,
    p:   g * RICE_PER_100.p   / 100,
    c:   g * RICE_PER_100.c   / 100,
    f:   g * RICE_PER_100.f   / 100
  };
}

function getMealMacros(m){
  if(!m.hasRice) return {cal:m.cal,p:m.p,c:m.c,f:m.f};
  const r = getRiceMacros(m.id);
  return {
    cal: Math.round(m.cal + r.cal),
    p:   Math.round((m.p + r.p)*10)/10,
    c:   Math.round(m.c + r.c),
    f:   Math.round((m.f + r.f)*10)/10
  };
}

function renderMeals(){
  document.getElementById('meal-list').innerHTML = MEALS.map(m => {
    const mac = getMealMacros(m);
    const done = state.checked[m.id];
    return `<div class="meal-card ${done?'done':''}" id="mc${m.id}">
      <div class="chk" onclick="toggle(${m.id})">
        <svg class="chk-svg" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="meal-info">
        <div class="meal-header">
          <span class="meal-name">${m.name}</span>
          <span class="meal-time">${m.time}</span>
        </div>
        <div class="meal-foods">${m.foods}</div>
        <div class="macro-pills">
          <span class="pill" id="pill-cal-${m.id}">${mac.cal} kcal</span>
          <span class="pill" id="pill-p-${m.id}">${mac.p}g protein</span>
          <span class="pill" id="pill-c-${m.id}">${mac.c}g carbs</span>
          <span class="pill" id="pill-f-${m.id}">${mac.f}g fat</span>
        </div>
        ${m.hasRice ? `<div class="rice-row">
          <label>Rice (cooked)</label>
          <input class="rice-input" type="number" value="${state.riceQty[m.id]||150}" 
            oninput="updateRice(${m.id},this.value)" placeholder="g"/>
          <span class="rice-unit">g</span>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function updateRice(id, val){
  state.riceQty[id] = parseFloat(val)||0;
  save();
  // update pills for this meal
  const m = MEALS.find(x=>x.id===id);
  const mac = getMealMacros(m);
  document.getElementById('pill-cal-'+id).textContent = mac.cal+' kcal';
  document.getElementById('pill-p-'+id).textContent = mac.p+'g protein';
  document.getElementById('pill-c-'+id).textContent = mac.c+'g carbs';
  document.getElementById('pill-f-'+id).textContent = mac.f+'g fat';
  updateMacros();
}

function toggle(id){
  state.checked[id] = !state.checked[id];
  save();
  renderMeals();
  updateMacros();
  if(state.checked[id]) showToast('Meal logged ✓');
}

function updateMacros(){
  let cal=0,p=0,c=0,f=0;
  MEALS.forEach(m => {
    if(state.checked[m.id]){
      const mac = getMealMacros(m);
      cal+=mac.cal; p+=mac.p; c+=mac.c; f+=mac.f;
    }
  });
  p = Math.round(p*10)/10;
  const done = Object.values(state.checked).filter(Boolean).length;
  const proLeft = Math.max(0, Math.round((140-p)*10)/10);

  document.getElementById('calVal').textContent = Math.round(cal);
  document.getElementById('proVal').textContent = p+'g';
  document.getElementById('carbVal').textContent = Math.round(c)+'g';
  document.getElementById('fatVal').textContent = Math.round(f)+'g';
  document.getElementById('proSub').textContent = '/ '+proLeft+'g remaining';
  document.getElementById('calBar').style.width = Math.min(100,Math.round(cal/2400*100))+'%';
  document.getElementById('proBar').style.width = Math.min(100,Math.round(p/140*100))+'%';
  document.getElementById('carbBar').style.width = Math.min(100,Math.round(c/250*100))+'%';
  document.getElementById('fatBar').style.width = Math.min(100,Math.round(f/75*100))+'%';
  document.getElementById('sumMeals').textContent = done+'/6';
  document.getElementById('sumCal').textContent = Math.round(cal);
  document.getElementById('sumPro').textContent = p+'g';
  document.getElementById('sumLeft').textContent = proLeft+'g';
}

function calcWhatIf(){
  let addCal=0,addP=0,addC=0,addF=0;
  const inputs = {
    eggs:parseFloat(document.getElementById('wi-eggs').value)||0,
    rice:parseFloat(document.getElementById('wi-rice').value)||0,
    chicken:parseFloat(document.getElementById('wi-chicken').value)||0,
    soya:parseFloat(document.getElementById('wi-soya').value)||0,
    chapati:parseFloat(document.getElementById('wi-chapati').value)||0,
    milk:parseFloat(document.getElementById('wi-milk').value)||0
  };
  Object.entries(inputs).forEach(([k,v])=>{
    if(v>0){
      addCal += v*WI_FOODS[k].cal;
      addP   += v*WI_FOODS[k].p;
      addC   += v*WI_FOODS[k].c;
      addF   += v*WI_FOODS[k].f;
    }
  });
  const hasInput = Object.values(inputs).some(v=>v>0);
  const res = document.getElementById('wi-result');
  if(!hasInput){res.classList.remove('show');return;}

  // current totals
  let curCal=0,curP=0,curC=0,curF=0;
  MEALS.forEach(m=>{if(state.checked[m.id]){const mac=getMealMacros(m);curCal+=mac.cal;curP+=mac.p;curC+=mac.c;curF+=mac.f;}});

  const newCal=Math.round(curCal+addCal);
  const newP=Math.round((curP+addP)*10)/10;
  const newC=Math.round(curC+addC);
  const newF=Math.round(curF+addF);
  const proLeft=Math.max(0,Math.round((140-newP)*10)/10);
  const calLeft=Math.max(0,2400-newCal);

  res.innerHTML = `
+${Math.round(addCal)} kcal  +${Math.round(addP*10)/10}g protein  +${Math.round(addC)}g carbs<br>
─────────────────────────────<br>
New total: ${newCal} kcal / 2400<br>
Protein:   ${newP}g / 140g${proLeft>0?' ('+proLeft+'g left)':' ✓ MET'}<br>
Calories:  ${calLeft>0?calLeft+' kcal remaining':newCal>2400?'Over by '+(newCal-2400)+' kcal':'✓ On target'}
  `;
  res.classList.add('show');
}

function clearWhatIf(){
  ['eggs','rice','chicken','soya','chapati','milk'].forEach(k=>{
    document.getElementById('wi-'+k).value='';
  });
  document.getElementById('wi-result').classList.remove('show');
}

function renderStock(){
  document.getElementById('stock-grid').innerHTML = STOCK_ITEMS.map(item=>{
    const qty = state.stock[item.key] || '';
    const low = qty !== '' && parseFloat(qty) < item.low;
    return `<div class="stock-item">
      <span class="stock-label">${item.label}</span>
      ${low?'<span class="low-badge">Low</span>':''}
      <span class="stock-unit">${item.unit}</span>
      <input class="stock-input" type="number" value="${qty}" placeholder="—"
        oninput="updateStock('${item.key}',this.value)"/>
    </div>`;
  }).join('');
}

function updateStock(key,val){
  state.stock[key]=val;
  save();
  renderStock();
}

let groceryPeriod = 'weekly';
function setPeriod(p, btn){
  groceryPeriod = p;
  state.groceryPeriod = p;
  save();
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrocery();
}

function renderGrocery(){
  const mult = groceryPeriod==='monthly' ? 4.33 : 1;
  const label = groceryPeriod==='monthly' ? '/month' : '/week';

  document.getElementById('grocery-list').innerHTML = GROCERY_ITEMS.map(item=>{
    const qty = Math.round(item.weekQty * mult);
    const price = state.prices[item.key] || '';
    return `<div class="grocery-item">
      <div class="gi-top">
        <span class="gi-name">${item.label}</span>
        <span class="gi-qty">${qty} ${item.unit} ${label}</span>
      </div>
      <div class="gi-bottom">
        <label>Price (${item.priceUnit})</label>
        <span style="font-size:12px;color:var(--dim);margin-right:4px">₹</span>
        <input class="price-input" type="number" value="${price}" placeholder="0"
          oninput="updatePrice('${item.key}',this.value)"/>
      </div>
    </div>`;
  }).join('');
  updateExpense();
}

function updatePrice(key,val){
  state.prices[key]=parseFloat(val)||0;
  save();
  updateExpense();
}

function updateExpense(){
  const mult = groceryPeriod==='monthly' ? 4.33 : 1;
  let total=0;
  const rows = GROCERY_ITEMS.map(item=>{
    const qty = item.weekQty * mult;
    const price = state.prices[item.key]||0;
    if(!price) return null;
    // estimate cost: rough unit conversion
    let cost=0;
    const key=item.key;
    if(key==='eggs') cost = price * Math.ceil(qty/12);
    else if(key==='milk') cost = price * Math.ceil(qty/500);
    else if(key==='rice'||key==='flour') cost = price * (qty/1000);
    else if(key==='soya') cost = price * Math.ceil(qty/200);
    else if(key==='chicken') cost = price * (qty/1000);
    else if(key==='liver') cost = price * Math.ceil(qty/500);
    else if(key==='potato'||key==='onion') cost = price * (qty/700);
    else if(key==='tomato') cost = price * (qty/800);
    else if(key==='spinach') cost = price * Math.ceil(qty/250);
    else if(key==='oil') cost = price * (qty/1000);
    else if(key==='spices') cost = price * mult;
    cost = Math.round(cost);
    total += cost;
    return {label:item.label, cost};
  }).filter(Boolean);

  document.getElementById('exp-rows').innerHTML = rows.map(r=>
    `<div class="exp-row"><span class="exp-key">${r.label}</span><span class="exp-val">₹${r.cost}</span></div>`
  ).join('');
  document.getElementById('exp-total').textContent = '₹'+Math.round(total);
}

function updateBudget(){
  const daily = parseFloat(document.getElementById('dailyBudget').value)||0;
  const spent = parseFloat(document.getElementById('spentBudget').value)||0;
  state.budget = {daily:document.getElementById('dailyBudget').value, spent:document.getElementById('spentBudget').value};
  save();
  const summary = document.getElementById('budgetSummary');
  if(daily>0){
    summary.style.display='block';
    const pct = Math.min(100,Math.round(spent/daily*100));
    const left = Math.max(0,daily-spent);
    document.getElementById('bTotal').textContent='₹'+daily;
    document.getElementById('bSpent').textContent='₹'+spent;
    document.getElementById('bLeft').textContent='₹'+Math.round(left);
    document.getElementById('bLeft').className='b-val '+(left>0?'green':'red');
    document.getElementById('budgetPct').textContent=pct+'% used';
    const bar=document.getElementById('budgetBar');
    bar.style.width=pct+'%';
    bar.className='prog-fill'+(pct>90?' danger':pct>70?' warn':'');
  } else summary.style.display='none';
}

function setTab(name,btn){
  ['meals','whatif','stock','grocery','budget'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'block':'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(name==='stock') renderStock();
  if(name==='grocery') renderGrocery();
}

function resetDay(){
  if(!confirm('Reset today\'s check-ins?')) return;
  state.checked={};
  save();
  renderMeals();
  updateMacros();
  showToast('Day reset ✓');
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// Init
load();
document.getElementById('dateStr').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
renderMeals();
updateMacros();
if(state.budget.daily) document.getElementById('dailyBudget').value=state.budget.daily;
if(state.budget.spent) document.getElementById('spentBudget').value=state.budget.spent;
updateBudget();
</script>
</body>
</html>
