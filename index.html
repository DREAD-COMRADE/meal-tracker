<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Meal Tracker"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="description" content="Track your meals, macros, budget & grocery list"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230d0d0d' width='192' height='192'/><circle cx='96' cy='96' r='80' fill='%23c8f135'/><path d='M96 50 L110 90 L152 90 L120 115 L135 155 L96 130 L57 155 L72 115 L40 90 L82 90 Z' fill='%230d0d0d'/></svg>"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230d0d0d' width='180' height='180' rx='40'/><circle cx='90' cy='90' r='70' fill='%23c8f135'/><path d='M90 45 L102 80 L140 80 L112 100 L125 135 L90 115 L55 135 L68 100 L40 80 L78 80 Z' fill='%230d0d0d'/></svg>"/>
<title>Nitheesh — Meal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--muted:#888;--dim:#555;
  --accent:#c8f135;--accent2:#9dba28;--danger:#ff5555;--warn:#f7c948;--r:10px;--r2:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;outline:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* Header */
.header{padding:20px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.header-left h1{font-size:22px;letter-spacing:-0.5px}
.header-left p{font-size:13px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.reset-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:var(--r2);transition:all .2s;flex-shrink:0;margin-top:4px;font-family:'DM Mono',monospace}
.reset-btn:hover{border-color:var(--danger);color:var(--danger)}
/* Macros */
.macros{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
.macro-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.macro-card.hl{border-color:#2e3d14;background:#131a08}
.macro-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;margin-bottom:6px}
.macro-card .value{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text)}
.macro-card.hl .value{color:var(--accent)}
.macro-card .sub{font-size:11px;color:var(--dim);margin-top:2px;font-family:'DM Mono',monospace}
.macro-card .bar-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.macro-card .bar{height:100%;border-radius:2px;background:var(--border2);transition:width .4s ease}
.macro-card.hl .bar{background:var(--accent)}
/* Tabs */
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--border);margin-bottom:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:none;color:var(--muted);font-size:13px;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{flex:1;padding:12px 20px 90px}
.sec-title{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;margin:16px 0 10px}
/* Meal card */
.meal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.meal-card.done{border-color:#2e3d14;background:#0e1508}
.meal-card.done .meal-name{color:var(--accent)}
.meal-top{display:flex;gap:14px;align-items:flex-start;padding:14px;position:relative;cursor:pointer;user-select:none}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;cursor:pointer}
.meal-card.done .chk{background:var(--accent);border-color:var(--accent)}
.chk-svg{display:none;width:12px;height:12px}
.meal-card.done .chk-svg{display:block}
.meal-info{flex:1;min-width:0}
.meal-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px;padding-right:52px}
.meal-name{font-size:14px;font-weight:600}
.meal-time{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;flex-shrink:0}
.meal-summary{font-size:12px;color:var(--muted);margin-bottom:6px}
.macro-pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace;background:var(--bg3);padding:2px 8px;border-radius:4px}
.pill.cal{color:var(--accent);background:#131a08}
.meal-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.edit-btn{background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-size:11px;padding:3px 8px;border-radius:4px;font-family:'DM Mono',monospace;transition:all .2s;cursor:pointer}
.edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.expand-arrow{font-size:10px;color:var(--dim);transition:transform .25s;display:inline-block;margin-left:6px}
/* Ingredient breakdown panel */
.meal-detail{display:none;padding:0 14px 14px 50px;border-top:1px solid var(--border)}
.meal-detail.open{display:block}
.ing-table{width:100%;border-collapse:collapse;margin-top:10px}
.ing-table th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-family:'DM Mono',monospace;text-align:right;padding:0 0 6px;font-weight:500}
.ing-table th:first-child{text-align:left}
.ing-table td{font-size:12px;padding:5px 0;border-top:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace;color:var(--muted)}
.ing-table td:first-child{text-align:left;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px}
.ing-table td .qty{font-size:11px;color:var(--dim);display:block;margin-top:1px}
.ing-table tr.total-row td{border-top:2px solid var(--border2);color:var(--text);font-weight:600;padding-top:8px}
.ing-table tr.total-row td:first-child{color:var(--accent)}
.ing-table td.cal-col{color:var(--accent)}
/* Add meal */
.add-meal-btn{width:100%;padding:11px;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r);color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;margin-top:4px;font-family:'DM Mono',monospace}
.add-meal-btn:hover{border-color:var(--accent);color:var(--accent)}
/* What-If */
.whatif-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.whatif-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.wi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wi-item{display:flex;flex-direction:column;gap:4px}
.wi-item label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.wi-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:14px;font-family:'DM Mono',monospace;padding:7px 10px;transition:border-color .2s}
.wi-input:focus{border-color:var(--accent)}
.wi-result{background:#131a08;border:1px solid #2e3d14;border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--accent);font-family:'DM Mono',monospace;line-height:1.8;display:none}
.wi-result.show{display:block}
.wi-btn{width:100%;padding:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-size:13px;transition:all .2s;margin-top:8px}
.wi-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Stock */
.stock-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stock-label{flex:1;font-size:14px}
.stock-unit{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.stock-input{width:72px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:14px;font-family:'DM Mono',monospace;padding:6px 10px;text-align:right;transition:border-color .2s}
.stock-input:focus{border-color:var(--accent)}
.low-badge{font-size:10px;background:#3d1a1a;color:var(--danger);padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace}
/* Grocery */
.grocery-period{display:flex;gap:8px;margin-bottom:14px}
.period-btn{flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--muted);font-size:13px;transition:all .2s}
.period-btn.active{border-color:var(--accent);color:var(--accent);background:#131a08}
.grocery-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.gi-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gi-name{flex:1;font-size:14px;font-weight:500}
.gi-edit-btn{background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-size:11px;padding:3px 8px;border-radius:4px;font-family:'DM Mono',monospace;transition:all .2s;cursor:pointer;flex-shrink:0}
.gi-edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.gi-bottom{display:flex;gap:8px;align-items:center}
.gi-bottom label{font-size:12px;color:var(--muted);flex:1}
.price-input{width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:13px;font-family:'DM Mono',monospace;padding:5px 8px;text-align:right;transition:border-color .2s}
.price-input:focus{border-color:var(--accent)}
.add-grocery-btn{width:100%;padding:11px;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r);color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;margin-bottom:14px;font-family:'DM Mono',monospace}
.add-grocery-btn:hover{border-color:var(--accent);color:var(--accent)}
.expense-summary{background:#131a08;border:1px solid #2e3d14;border-radius:var(--r);padding:16px;margin-top:14px}
.exp-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.exp-row+.exp-row{border-top:1px solid #1e2d08}
.exp-key{font-size:13px;color:var(--muted)}
.exp-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.exp-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:2px solid #2e3d14}
.exp-total-key{font-size:14px;font-weight:600}
.exp-total-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
/* Budget */
.bud-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bud-input-grp{display:flex;flex-direction:column;gap:4px}
.bud-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.bud-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:16px;font-family:'DM Mono',monospace;padding:8px 10px;transition:border-color .2s}
.bud-input:focus{border-color:var(--accent)}
.budgetSummary{background:#131a08;border:1px solid #2e3d14;border-radius:var(--r);padding:16px;display:none}
.b-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.b-val.red{color:var(--danger)}
.b-val.green{color:var(--accent)}
.prog-wrap{height:8px;background:var(--bg3);border-radius:4px;margin-top:10px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.prog-fill.warn{background:var(--warn)}
.prog-fill.danger{background:var(--danger)}
/* Targets */
.tgt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tgt-grp{display:flex;flex-direction:column;gap:4px}
.tgt-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.tgt-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:16px;font-family:'DM Mono',monospace;padding:8px 10px;transition:border-color .2s}
.tgt-input:focus{border-color:var(--accent)}
/* Modals */
.modal-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);width:100%;max-width:480px;border-radius:var(--r) var(--r) 0 0;padding:20px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px;color:var(--accent)}
.modal-grp{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.modal-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.modal-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:14px;font-family:'DM Mono',monospace;padding:8px 10px;transition:border-color .2s}
.modal-input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-btn{flex:1;padding:10px;border-radius:var(--r2);font-size:13px;transition:all .2s;font-weight:500}
.save-btn{background:var(--accent);color:var(--bg);border:1px solid var(--accent)}
.save-btn:hover{opacity:0.9}
.cancel-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text)}
.cancel-btn:hover{border-color:var(--accent)}
.delete-btn{background:#3d1a1a;border:1px solid var(--danger);color:var(--danger)}
.delete-btn:hover{background:var(--danger);color:var(--bg)}
/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;font-size:13px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 40px)}
.toast.show{opacity:1;pointer-events:auto}
/* Safe area support */
@supports (padding: max(0px)) {
  .app { padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right)); }
  .content { padding-bottom: max(90px, calc(90px + env(safe-area-inset-bottom))); }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>Meal Tracker</h1>
      <p id="dateStr">Loading...</p>
    </div>
    <button class="reset-btn" onclick="resetDay()">Reset Day</button>
  </div>

  <!-- Macros -->
  <div class="macros">
    <div class="macro-card hl">
      <div class="label">Calories</div>
      <div class="value" id="mac-cal">0</div>
      <div class="sub" id="mac-cal-sub">/ 2000</div>
      <div class="bar-wrap"><div class="bar" id="bar-cal"></div></div>
    </div>
    <div class="macro-card hl">
      <div class="label">Protein</div>
      <div class="value" id="mac-pro">0g</div>
      <div class="sub" id="mac-pro-sub">/ 100g</div>
      <div class="bar-wrap"><div class="bar" id="bar-pro"></div></div>
    </div>
    <div class="macro-card">
      <div class="label">Carbs</div>
      <div class="value" id="mac-carbs">0g</div>
      <div class="sub" id="mac-carbs-sub">/ 250g</div>
      <div class="bar-wrap"><div class="bar" id="bar-carbs"></div></div>
    </div>
    <div class="macro-card">
      <div class="label">Fat</div>
      <div class="value" id="mac-fat">0g</div>
      <div class="sub" id="mac-fat-sub">/ 65g</div>
      <div class="bar-wrap"><div class="bar" id="bar-fat"></div></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('meals',this)">Meals</button>
    <button class="tab-btn" onclick="setTab('whatif',this)">What-if</button>
    <button class="tab-btn" onclick="setTab('stock',this)">Stock</button>
    <button class="tab-btn" onclick="setTab('grocery',this)">Grocery</button>
    <button class="tab-btn" onclick="setTab('budget',this)">Budget</button>
    <button class="tab-btn" onclick="setTab('targets',this)">Targets</button>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Meals Tab -->
    <div id="tab-meals" style="display:block">
      <div id="meals-list"></div>
      <button class="add-meal-btn" onclick="openMealModal()">+ Add Meal</button>
    </div>

    <!-- What-If Tab -->
    <div id="tab-whatif" style="display:none">
      <div class="whatif-card">
        <div class="whatif-title">Quick Macro Calc</div>
        <div class="wi-grid">
          <div class="wi-item">
            <label>Protein (g)</label>
            <input class="wi-input" id="wi-pro" type="number" placeholder="0"/>
          </div>
          <div class="wi-item">
            <label>Carbs (g)</label>
            <input class="wi-input" id="wi-carbs" type="number" placeholder="0"/>
          </div>
          <div class="wi-item">
            <label>Fat (g)</label>
            <input class="wi-input" id="wi-fat" type="number" placeholder="0"/>
          </div>
          <div class="wi-item">
            <label>Fiber (g)</label>
            <input class="wi-input" id="wi-fiber" type="number" placeholder="0"/>
          </div>
        </div>
        <button class="wi-btn" onclick="calcWhatIf()">Calculate</button>
        <div class="wi-result" id="wi-result"></div>
      </div>
    </div>

    <!-- Stock Tab -->
    <div id="tab-stock" style="display:none">
      <div class="sec-title">Current Stock</div>
      <div id="stock-list"></div>
    </div>

    <!-- Grocery Tab -->
    <div id="tab-grocery" style="display:none">
      <div class="grocery-period">
        <button class="period-btn active" onclick="setGroceryPeriod('weekly',this)">Weekly</button>
        <button class="period-btn" onclick="setGroceryPeriod('monthly',this)">Monthly</button>
      </div>
      <button class="add-grocery-btn" onclick="openGroceryModal()">+ Add Item</button>
      <div id="grocery-list"></div>
      <div class="expense-summary">
        <div class="exp-row">
          <span class="exp-key">Estimated Spend</span>
          <span class="exp-val" id="exp-total">₹0</span>
        </div>
        <div id="exp-rows"></div>
      </div>
    </div>

    <!-- Budget Tab -->
    <div id="tab-budget" style="display:none">
      <div class="bud-inputs">
        <div class="bud-input-grp">
          <label class="bud-label">Daily Budget</label>
          <input class="bud-input" id="dailyBudget" type="number" onchange="updateBudget()" placeholder="500"/>
        </div>
        <div class="bud-input-grp">
          <label class="bud-label">Spent Today</label>
          <input class="bud-input" id="spentBudget" type="number" onchange="updateBudget()" placeholder="0"/>
        </div>
      </div>
      <div class="budgetSummary" id="budgetSummary">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--muted)">
          <span>₹<span id="bSpent">0</span> / ₹<span id="bTotal">0</span></span>
          <span id="budgetPct">0% used</span>
        </div>
        <div class="prog-wrap"><div class="prog-fill" id="budgetBar"></div></div>
        <div style="margin-top:12px;font-size:18px;text-align:center">
          <span id="bLeft" class="b-val">0</span> <span style="font-size:13px;color:var(--muted)">remaining</span>
        </div>
      </div>
    </div>

    <!-- Targets Tab -->
    <div id="tab-targets" style="display:none">
      <div class="tgt-grid">
        <div class="tgt-grp">
          <label class="tgt-label">Calories</label>
          <input class="tgt-input" id="tgt-cal" type="number" onchange="saveTgtTargets()" placeholder="2000"/>
        </div>
        <div class="tgt-grp">
          <label class="tgt-label">Protein (g)</label>
          <input class="tgt-input" id="tgt-pro" type="number" onchange="saveTgtTargets()" placeholder="100"/>
        </div>
        <div class="tgt-grp">
          <label class="tgt-label">Carbs (g)</label>
          <input class="tgt-input" id="tgt-carbs" type="number" onchange="saveTgtTargets()" placeholder="250"/>
        </div>
        <div class="tgt-grp">
          <label class="tgt-label">Fat (g)</label>
          <input class="tgt-input" id="tgt-fat" type="number" onchange="saveTgtTargets()" placeholder="65"/>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<!-- Meal Modal -->
<div class="modal-backdrop" id="meal-modal-backdrop" onclick="mealBackdropClick(event)">
  <div class="modal">
    <h2 id="meal-modal-title">Add Meal</h2>
    <div class="modal-grp">
      <label class="modal-label">Meal Name</label>
      <input class="modal-input" id="meal-name" type="text" placeholder="e.g. Breakfast"/>
    </div>
    <div class="modal-grp">
      <label class="modal-label">Time</label>
      <input class="modal-input" id="meal-time" type="time"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="modal-grp">
        <label class="modal-label">Protein (g)</label>
        <input class="modal-input" id="meal-pro" type="number" placeholder="0"/>
      </div>
      <div class="modal-grp">
        <label class="modal-label">Carbs (g)</label>
        <input class="modal-input" id="meal-carbs" type="number" placeholder="0"/>
      </div>
      <div class="modal-grp">
        <label class="modal-label">Fat (g)</label>
        <input class="modal-input" id="meal-fat" type="number" placeholder="0"/>
      </div>
      <div class="modal-grp">
        <label class="modal-label">Fiber (g)</label>
        <input class="modal-input" id="meal-fiber" type="number" placeholder="0"/>
      </div>
    </div>
    <div class="modal-grp">
      <label class="modal-label">Ingredients (optional)</label>
      <textarea class="modal-input" id="meal-ingredients" placeholder="Item 1, Item 2..." style="min-height:80px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel-btn" onclick="closeMealModal()">Cancel</button>
      <button class="modal-btn delete-btn" id="meal-delete-btn" style="display:none" onclick="deleteMeal()">Delete</button>
      <button class="modal-btn save-btn" onclick="saveMeal()">Save</button>
    </div>
  </div>
</div>

<!-- Grocery Modal -->
<div class="modal-backdrop" id="grocery-modal-backdrop" onclick="groceryBackdropClick(event)">
  <div class="modal">
    <h2>Add Grocery Item</h2>
    <div class="modal-grp">
      <label class="modal-label">Item Name</label>
      <input class="modal-input" id="gi-name" type="text" placeholder="e.g. Rice"/>
    </div>
    <div class="modal-grp">
      <label class="modal-label">Unit</label>
      <input class="modal-input" id="gi-unit" type="text" placeholder="e.g. kg, liters"/>
    </div>
    <div class="modal-grp">
      <label class="modal-label">Weekly Qty</label>
      <input class="modal-input" id="gi-weekqty" type="number" placeholder="0"/>
    </div>
    <div class="modal-grp">
      <label class="modal-label">Price Label</label>
      <input class="modal-input" id="gi-pricelabel" type="text" placeholder="e.g. per kg"/>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel-btn" onclick="closeGroceryModal()">Cancel</button>
      <button class="modal-btn delete-btn" id="gi-delete-btn" style="display:none" onclick="deleteGroceryItem()">Delete</button>
      <button class="modal-btn save-btn" onclick="saveGroceryItem()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// Register Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      console.log('✓ Service Worker registered');
    }).catch(err=>console.log('Service Worker failed:',err));
  });
}

// Data
const TARGETS={cal:2000,pro:100,carbs:250,fat:65};
const STOCK_ITEMS=[{key:'eggs',label:'Eggs',unit:'nos',threshold:6},{key:'milk',label:'Milk',unit:'ml',threshold:1000},{key:'rice',label:'Rice',unit:'g',threshold:2000},{key:'flour',label:'Flour',unit:'g',threshold:500},{key:'soya',label:'Soya',unit:'g',threshold:400},{key:'chicken',label:'Chicken',unit:'g',threshold:500},{key:'liver',label:'Liver',unit:'g',threshold:300},{key:'potato',label:'Potato',unit:'g',threshold:1000},{key:'onion',label:'Onion',unit:'g',threshold:500},{key:'tomato',label:'Tomato',unit:'g',threshold:500},{key:'spinach',label:'Spinach',unit:'g',threshold:250},{key:'oil',label:'Oil',unit:'ml',threshold:500},{key:'peanuts',label:'Peanuts',unit:'g',threshold:200},{key:'curd',label:'Curd',unit:'g',threshold:500},{key:'banana',label:'Banana',unit:'nos',threshold:6},{key:'spices',label:'Spices Mix',unit:'mixed',threshold:1}];
const GROCERY_ITEMS=[{key:'eggs',label:'Eggs',unit:'dozen',weekQty:1,priceUnit:'per dozen'},{key:'milk',label:'Milk',unit:'liters',weekQty:2,priceUnit:'per liter'},{key:'rice',label:'Rice',unit:'kg',weekQty:1,priceUnit:'per kg'},{key:'flour',label:'Flour',unit:'kg',weekQty:0.5,priceUnit:'per kg'},{key:'soya',label:'Soya',unit:'kg',weekQty:0.4,priceUnit:'per kg'},{key:'chicken',label:'Chicken',unit:'kg',weekQty:0.5,priceUnit:'per kg'},{key:'liver',label:'Liver',unit:'kg',weekQty:0.3,priceUnit:'per kg'},{key:'potato',label:'Potato',unit:'kg',weekQty:1,priceUnit:'per kg'},{key:'onion',label:'Onion',unit:'kg',weekQty:0.5,priceUnit:'per kg'},{key:'tomato',label:'Tomato',unit:'kg',weekQty:0.5,priceUnit:'per kg'},{key:'spinach',label:'Spinach',unit:'kg',weekQty:0.25,priceUnit:'per kg'},{key:'oil',label:'Oil',unit:'liters',weekQty:0.5,priceUnit:'per liter'},{key:'peanuts',label:'Peanuts',unit:'kg',weekQty:0.2,priceUnit:'per kg'},{key:'curd',label:'Curd',unit:'kg',weekQty:0.5,priceUnit:'per kg'},{key:'banana',label:'Banana',unit:'dozen',weekQty:0.5,priceUnit:'per dozen'},{key:'spices',label:'Spices Mix',unit:'mixed',weekQty:1,priceUnit:'per week'}];

let state={meals:[],checked:{},stock:{},prices:{},budget:{daily:0,spent:0},groceryPeriod:'weekly',groceryItems:JSON.parse(JSON.stringify(GROCERY_ITEMS))};
let editingMealKey=null,editingGroceryKey=null,groceryPeriod='weekly';

function save(){localStorage.setItem('mealTrackerState',JSON.stringify(state));}
function load(){const d=localStorage.getItem('mealTrackerState');if(d) state=JSON.parse(d);}

// Meals
function openMealModal(){editingMealKey=null;document.getElementById('meal-modal-title').textContent='Add Meal';['meal-name','meal-time','meal-pro','meal-carbs','meal-fat','meal-fiber','meal-ingredients'].forEach(id=>document.getElementById(id).value='');document.getElementById('meal-delete-btn').style.display='none';const now=new Date();document.getElementById('meal-time').value=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');document.getElementById('meal-modal-backdrop').classList.add('open');document.body.style.overflow='hidden';}

function closeMealModal(){document.getElementById('meal-modal-backdrop').classList.remove('open');document.body.style.overflow='';}
function mealBackdropClick(e){if(e.target===document.getElementById('meal-modal-backdrop'))closeMealModal();}

function saveMeal(){const name=document.getElementById('meal-name').value.trim();if(!name){showToast('Name required');return;}const time=document.getElementById('meal-time').value;const meal={name,time,pro:parseFloat(document.getElementById('meal-pro').value)||0,carbs:parseFloat(document.getElementById('meal-carbs').value)||0,fat:parseFloat(document.getElementById('meal-fat').value)||0,fiber:parseFloat(document.getElementById('meal-fiber').value)||0,ingredients:document.getElementById('meal-ingredients').value.trim()};if(editingMealKey){const idx=state.meals.findIndex(m=>m.key===editingMealKey);if(idx>=0) state.meals[idx]={...state.meals[idx],...meal};showToast('Meal updated ✓');}else{state.meals.push({key:'meal_'+Date.now(),...meal});showToast('Meal added ✓');}save();renderMeals();updateMacros();closeMealModal();}

function deleteMeal(){if(!confirm('Delete meal?')) return;state.meals=state.meals.filter(m=>m.key!==editingMealKey);delete state.checked[editingMealKey];save();renderMeals();updateMacros();closeMealModal();showToast('Meal deleted');}

function renderMeals(){const list=document.getElementById('meals-list');list.innerHTML=state.meals.map(meal=>{const isChecked=state.checked[meal.key];const cals=Math.round((meal.pro*4)+(meal.carbs*4)+(meal.fat*9));return `<div class="meal-card ${isChecked?'done':''}"><div class="meal-top" onclick="toggleMeal('${meal.key}')"><div class="chk"><svg class="chk-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="meal-info"><div class="meal-header"><div class="meal-name">${meal.name}</div><div class="meal-time">${meal.time}</div></div><div class="meal-summary">${meal.pro}p / ${meal.carbs}c / ${meal.fat}f</div><div class="macro-pills"><span class="pill cal">${cals} kcal</span><span class="pill">${meal.fiber}g fiber</span></div></div><div class="meal-actions"><button class="edit-btn" onclick="editMeal(event,'${meal.key}')">Edit</button></div></div></div>`}).join('');if(state.meals.length===0) list.innerHTML='<p style="color:var(--muted);text-align:center;padding:20px">No meals added yet</p>';}

function toggleMeal(key){state.checked[key]=!state.checked[key];save();renderMeals();updateMacros();}

function editMeal(e,key){e.stopPropagation();editingMealKey=key;const meal=state.meals.find(m=>m.key===key);document.getElementById('meal-modal-title').textContent='Edit Meal';document.getElementById('meal-name').value=meal.name;document.getElementById('meal-time').value=meal.time;document.getElementById('meal-pro').value=meal.pro;document.getElementById('meal-carbs').value=meal.carbs;document.getElementById('meal-fat').value=meal.fat;document.getElementById('meal-fiber').value=meal.fiber;document.getElementById('meal-ingredients').value=meal.ingredients||'';document.getElementById('meal-delete-btn').style.display='block';document.getElementById('meal-modal-backdrop').classList.add('open');document.body.style.overflow='hidden';}

function updateMacros(){const checked=state.meals.filter(m=>state.checked[m.key]);const totals={pro:0,carbs:0,fat:0,cals:0};checked.forEach(m=>{totals.pro+=m.pro;totals.carbs+=m.carbs;totals.fat+=m.fat;totals.cals+=Math.round((m.pro*4)+(m.carbs*4)+(m.fat*9));});const cal=TARGETS.cal,pro=TARGETS.pro,carbs=TARGETS.carbs,fat=TARGETS.fat;document.getElementById('mac-cal').textContent=totals.cals;document.getElementById('mac-cal-sub').textContent='/ '+cal;document.getElementById('mac-pro').textContent=Math.round(totals.pro)+'g';document.getElementById('mac-pro-sub').textContent='/ '+pro+'g';document.getElementById('mac-carbs').textContent=Math.round(totals.carbs)+'g';document.getElementById('mac-carbs-sub').textContent='/ '+carbs+'g';document.getElementById('mac-fat').textContent=Math.round(totals.fat)+'g';document.getElementById('mac-fat-sub').textContent='/ '+fat+'g';document.getElementById('bar-cal').style.width=Math.min(100,(totals.cals/cal)*100)+'%';document.getElementById('bar-pro').style.width=Math.min(100,(totals.pro/pro)*100)+'%';document.getElementById('bar-carbs').style.width=Math.min(100,(totals.carbs/carbs)*100)+'%';document.getElementById('bar-fat').style.width=Math.min(100,(totals.fat/fat)*100)+'%';}

function calcWhatIf(){const pro=parseFloat(document.getElementById('wi-pro').value)||0,carbs=parseFloat(document.getElementById('wi-carbs').value)||0,fat=parseFloat(document.getElementById('wi-fat').value)||0,fiber=parseFloat(document.getElementById('wi-fiber').value)||0;const cals=Math.round((pro*4)+(carbs*4)+(fat*9));const result=document.getElementById('wi-result');result.innerHTML=`${cals} kcal<br/>${pro}g protein | ${carbs}g carbs | ${fat}g fat<br/>Fiber: ${fiber}g`;result.classList.add('show');}

// Stock
function renderStock(){const list=document.getElementById('stock-list');const items=state.stockItems||JSON.parse(JSON.stringify(STOCK_ITEMS));list.innerHTML=items.map(item=>{const val=state.stock[item.key]||0;const low=val<item.threshold;return `<div class="stock-item"><div class="stock-label">${item.label}</div><div style="flex:1;text-align:right"><span class="stock-unit">${val} ${item.unit}</span>${low?'<span class="low-badge">Low</span>':''}</div><input class="stock-input" type="number" value="${val}" onchange="updateStock('${item.key}',this.value)"/></div>`}).join('');}

function updateStock(key,val){state.stock[key]=parseFloat(val)||0;save();}

// Grocery
function getGroceryItems(){return(state.groceryItems||JSON.parse(JSON.stringify(GROCERY_ITEMS)));}

function setGroceryPeriod(p,btn){groceryPeriod=p;state.groceryPeriod=p;save();document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderGrocery();}

function renderGrocery(){const list=document.getElementById('grocery-list');const items=getGroceryItems();list.innerHTML=items.map(item=>{const price=state.prices[item.key]||0;return `<div class="grocery-item"><div class="gi-top"><div class="gi-name">${item.label}</div><button class="gi-edit-btn" onclick="editGroceryItem(event,'${item.key}')">Edit</button></div><div class="gi-bottom"><label>${item.weekQty} ${item.unit}/wk • ${item.priceUnit}</label><input class="price-input" type="number" value="${price}" placeholder="0" onchange="updatePrice('${item.key}',this.value)"/></div></div>`}).join('');updateExpense();}

function editGroceryItem(e,key){e.stopPropagation();editingGroceryKey=key;const items=getGroceryItems();const item=items.find(i=>i.key===key);document.getElementById('gi-name').value=item.label;document.getElementById('gi-unit').value=item.unit;document.getElementById('gi-weekqty').value=item.weekQty;document.getElementById('gi-pricelabel').value=item.priceUnit;document.getElementById('gi-delete-btn').style.display='none';['gi-name','gi-unit','gi-weekqty','gi-pricelabel'].forEach(id=>document.getElementById(id).value='');document.getElementById('grocery-modal-backdrop').classList.add('open');document.body.style.overflow='hidden';}

function groceryBackdropClick(e){if(e.target===document.getElementById('grocery-modal-backdrop'))closeGroceryModal();}
function closeGroceryModal(){document.getElementById('grocery-modal-backdrop').classList.remove('open');document.body.style.overflow='';}

function saveGroceryItem(){const label=document.getElementById('gi-name').value.trim();if(!label){showToast('Name required');return;}if(!state.groceryItems) state.groceryItems=JSON.parse(JSON.stringify(GROCERY_ITEMS));const obj={label,unit:document.getElementById('gi-unit').value.trim()||'g',weekQty:parseFloat(document.getElementById('gi-weekqty').value)||0,priceUnit:document.getElementById('gi-pricelabel').value.trim()||'per unit'};if(editingGroceryKey){const idx=state.groceryItems.findIndex(x=>x.key===editingGroceryKey);if(idx>=0) state.groceryItems[idx]={...state.groceryItems[idx],...obj};showToast('Item updated ✓');}else{state.groceryItems.push({key:'custom_'+Date.now(),...obj});showToast('Item added ✓');}save();renderGrocery();closeGroceryModal();}

function deleteGroceryItem(){if(!confirm('Remove this item?')) return;if(!state.groceryItems) state.groceryItems=JSON.parse(JSON.stringify(GROCERY_ITEMS));state.groceryItems=state.groceryItems.filter(x=>x.key!==editingGroceryKey);delete state.prices[editingGroceryKey];save();renderGrocery();closeGroceryModal();showToast('Item removed');}

function updatePrice(key,val){state.prices[key]=parseFloat(val)||0;save();updateExpense();}

function updateExpense(){const mult=groceryPeriod==='monthly'?4.33:1;let total=0;const rows=getGroceryItems().map(item=>{const qty=item.weekQty*mult,price=state.prices[item.key]||0;if(!price) return null;let cost=0,k=item.key;if(k==='eggs') cost=price*Math.ceil(qty/12);else if(k==='milk') cost=price*Math.ceil(qty/500);else if(k==='rice'||k==='flour') cost=price*(qty/1000);else if(k==='soya') cost=price*Math.ceil(qty/200);else if(k==='chicken') cost=price*(qty/1000);else if(k==='liver') cost=price*Math.ceil(qty/500);else if(k==='potato'||k==='onion') cost=price*(qty/700);else if(k==='tomato') cost=price*(qty/800);else if(k==='spinach') cost=price*Math.ceil(qty/250);else if(k==='oil') cost=price*(qty/1000);else if(k==='peanuts') cost=price*Math.ceil(qty/500);else if(k==='curd') cost=price*Math.ceil(qty/500);else if(k==='banana') cost=price*(qty/12);else if(k==='spices') cost=price*mult;else cost=price*(qty/100);cost=Math.round(cost);total+=cost;return{label:item.label,cost};}).filter(Boolean);document.getElementById('exp-rows').innerHTML=rows.map(r=>`<div class="exp-row"><span class="exp-key">${r.label}</span><span class="exp-val">₹${r.cost}</span></div>`).join('');document.getElementById('exp-total').textContent='₹'+Math.round(total);}

// Budget
function updateBudget(){const daily=parseFloat(document.getElementById('dailyBudget').value)||0;const spent=parseFloat(document.getElementById('spentBudget').value)||0;state.budget={daily:document.getElementById('dailyBudget').value,spent:document.getElementById('spentBudget').value};save();const summary=document.getElementById('budgetSummary');if(daily>0){summary.style.display='block';const pct=Math.min(100,Math.round(spent/daily*100)),left=Math.max(0,daily-spent);document.getElementById('bTotal').textContent='₹'+daily;document.getElementById('bSpent').textContent='₹'+spent;document.getElementById('bLeft').textContent='₹'+Math.round(left);document.getElementById('bLeft').className='b-val '+(left>0?'green':'red');document.getElementById('budgetPct').textContent=pct+'% used';const bar=document.getElementById('budgetBar');bar.style.width=pct+'%';bar.className='prog-fill'+(pct>90?' danger':pct>70?' warn':'');}else summary.style.display='none';}

function saveTgtTargets(){TARGETS.cal=parseFloat(document.getElementById('tgt-cal').value)||2000;TARGETS.pro=parseFloat(document.getElementById('tgt-pro').value)||100;TARGETS.carbs=parseFloat(document.getElementById('tgt-carbs').value)||250;TARGETS.fat=parseFloat(document.getElementById('tgt-fat').value)||65;updateMacros();}

// Tabs
function setTab(name,btn){['meals','whatif','stock','grocery','budget','targets'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===name?'block':'none';});document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(name==='stock') renderStock();if(name==='grocery') renderGrocery();}

function resetDay(){if(!confirm('Reset today\'s check-ins?')) return;state.checked={};save();renderMeals();updateMacros();showToast('Day reset ✓');}

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

// Init
load();
document.getElementById('dateStr').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('tgt-cal').value=TARGETS.cal;
document.getElementById('tgt-pro').value=TARGETS.pro;
document.getElementById('tgt-carbs').value=TARGETS.carbs;
document.getElementById('tgt-fat').value=TARGETS.fat;
renderMeals();
updateMacros();
if(state.budget.daily) document.getElementById('dailyBudget').value=state.budget.daily;
if(state.budget.spent) document.getElementById('spentBudget').value=state.budget.spent;
updateBudget();
groceryPeriod=state.groceryPeriod||'weekly';
</script>
</body>
</html>
